<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz – Straż Graniczna i Wiedza Ogólna</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #004080;
            margin-top: 0;
            font-size: 1.2rem;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 10px;
        }
        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .btn-option {
            display: block;
            width: 100%;
            text-align: left;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 18px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-option:hover:not(:disabled) {
            background: #e2e6ea;
            border-color: #cbd3da;
        }
        .btn-option.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }
        .btn-option.incorrect {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }
        .btn-option:disabled {
            cursor: default;
        }
        .btn-action {
            background: #004080;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            display: none;
        }
        .btn-action:hover {
            background: #002b5c;
        }
        .progress {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .score-container {
            text-align: center;
        }
        .score-container h3 {
            font-size: 2rem;
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="card" id="quiz-container">
    <div class="score-container">
        <h2>Witaj w quizie przygotowującym!</h2>
        <p>Aplikacja wylosuje dla Ciebie 10 pytań z puli 200 pytań.</p>
        <button class="btn-action" style="display: inline-block;" onclick="startQuiz()">Rozpocznij Quiz</button>
    </div>
</div>
