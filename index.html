    function pobierzStatystyki() {
        let stats = localStorage.getItem('quiz_bledy');
        return stats ? JSON.parse(stats) : {};
    }

    function zapiszStatystyki(stats) {
        localStorage.setItem('quiz_bledy', JSON.stringify(stats));
    }

    let losowePytania = [];
    let aktualnePytanieIndex = 0;
    let punkty = 0;

    function startQuiz() {
        let stats = pobierzStatystyki();

        let pulaWazona = [];
        bazaPytan.forEach(p => {
            let bledy = stats[p.id] || 0;
            let waga = 1 + (bledy * 3); 
            for (let i = 0; i < waga; i++) {
                pulaWazona.push(p);
            }
        });

        let wybraneUnikalne = [];
        let szuflada = [...pulaWazona].sort(() => 0.5 - Math.random());
        
        for (let p of szuflada) {
            if (!wybraneUnikalne.some(item => item.id === p.id)) {
                wybraneUnikalne.push(p);
                if (wybraneUnikalne.length === 10) break;
            }
        }

        losowePytania = wybraneUnikalne;
        aktualnePytanieIndex = 0;
        punkty = 0;
        pokazPytanie();
    }

    function pokazPytanie() {
        if (aktualnePytanieIndex >= losowePytania.length) {
            pokazWynik();
            return;
        }

        let p = losowePytania[aktualnePytanieIndex];

        let html = `
            <div class="progress">Pytanie ${aktualnePytanieIndex + 1} z ${losowePytania.length}</div>
            <div class="question-text">${p.q}</div>
        `;

        p.o.forEach((odp, idx) => {
            html += `<button class="btn-option" onclick="sprawdzOdpowiedz(${idx}, ${p.a}, ${p.id}, this)">${odp}</button>`;
        });

        html += `<button class="btn-action" id="next-btn" onclick="nastepnePytanie()">Następne pytanie</button>`;

        document.getElementById('quiz-container').innerHTML = html;
    }

    function sprawdzOdpowiedz(wybrana, poprawna, idPytania, element) {
        const przyciski = document.querySelectorAll('.btn-option');
        przyciski.forEach(btn => btn.disabled = true);

        let stats = pobierzStatystyki();

        if (wybrana === poprawna) {
            element.classList.add('correct');
            punkty++;
            if (stats[idPytania] && stats[idPytania] > 0) {
                stats[idPytania]--;
            }
        } else {
            element.classList.add('incorrect');
            przyciski[poprawna].classList.add('correct');
            stats[idPytania] = (stats[idPytania] || 0) + 1;
        }

        zapiszStatystyki(stats);
        document.getElementById('next-btn').style.display = 'block';
    }

    function nastepnePytanie() {
        aktualnePytanieIndex++;
        pokazPytanie();
    }

    function pokazWynik() {
        let ocenaKomunikat = punkty >= 9 ? "Świetny wynik! Jesteś świetnie przygotowany." : (punkty >= 6 ? "Dobry wynik, ale warto jeszcze powtórzyć materiał." : "Musisz jeszcze trochę poszerzyć swoją wiedzę!");
        
        let html = `
            <div class="score-container">
                <h2>Koniec quizu!</h2>
                <p>Twój ostateczny wynik:</p>
                <h3>${punkty} / ${losowePytania.length}</h3>
                <p>${ocenaKomunikat}</p>
                <button class="btn-action" id="restart-btn" style="display: inline-block;">Rozwiąż ponownie</button>
            </div>
        `;
        document.getElementById('quiz-container').innerHTML = html;
        document.getElementById('restart-btn').addEventListener('click', startQuiz);
    }

    // Podpięcie przycisku startowego po załadowaniu strony
    document.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');
        if (startBtn) {
            startBtn.addEventListener('click', startQuiz);
        }
    });
</script>
