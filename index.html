            { q: "Powołana 01 października 2023 roku Wyższa Szkoła Straży Granicznej znajduje się w:", o: ["Lubaniu", "Kętrzynie", "Koszalinie", "Warszawie"], a: 0 },
            { q: "Siedziba Komendy Głównej Straży Granicznej znajduje się w:", o: ["Warszawie", "Gdańsku", "Raciborzu", "Przemyślu"], a: 0 },
            { q: "Agencja o nazwie FRONTEX oznacza:", o: ["Agencję Bezpieczeństwa Wewnętrznego", "Europejską Agencję Rozwoju", "Europejską Agencję Straży Granicznej i Przybrzeżnej", "organizację non-profit zajmującą się pomocą humanitarną dla nielegalnych migrantów"], a: 2 },
            { q: "Podporucznik Straży Granicznej to stopień służbowy należący do korpusu:", o: ["szeregowych", "podoficerów", "chorążych", "oficerów"], a: 3 },
            { q: "Terenowymi organami Straży Granicznej są:", o: ["komendanci oddziałów, placówek i dywizjonów Straży Granicznej", "komendanci ośrodków szkolenia i Wyższej Szkoły Straży Granicznej", "komendanci drogowych i osobowych przejść granicznych", "dowódcy jednostek pływających Straży Granicznej"], a: 0 },
            { q: "Straż Graniczna, jako jednolita, umundurowana i uzbrojona formacja została powołana ustawą z dnia:", o: ["12 października 1991 r.", "12 października 1990 r.", "16 maja 1991 r.", "31 maja 1995 r."], a: 1 },
            { q: "Nadzór nad działalnością sądów powszechnych i wojskowych w zakresie orzekania sprawuje:", o: ["Sąd Najwyższy", "Trybunał Stanu", "Naczelny Sąd Administracyjny", "Prezes NIK"], a: 0 },
            { q: "Starosta kieruje:", o: ["gminą", "urzędem", "powiatem", "województwem"], a: 2 },
            { q: "Osoba, która opuszcza miejsce zamieszkania w celu osiedlenia się w innym kraju to:", o: ["uchodźca", "emigrant", "azylant", "imigrant"], a: 1 },
            { q: "Kadencja wójta, burmistrza i prezydenta miasta trwa:", o: ["5 lat", "4 lata", "6 lat", "3 lata"], a: 0 },
            { q: "Straż Graniczna to formacja typu:", o: ["wojskowego", "policyjnego", "zmilitaryzowanego", "społecznego"], a: 1 },
            { q: "Straż Graniczna jako formacja podlega:", o: ["Ministerstwu Obrony Narodowej", "Ministerstwu Spraw Wewnętrznych i Administracji", "Prezesowi Rady Ministrów", "Prezydentowi"], a: 1 },
            { q: "Zgodnie z Ustawą o Straży Granicznej, Straż Graniczna to formacja:", o: ["jednolita, umundurowana, uzbrojona", "umundurowana, skoszarowana, uzbrojona", "militarna, wyspecjalizowana, zmotoryzowana", "umundurowana, skoszarowana, wyspecjalizowana"], a: 0 },
            { q: "Granica rzeczna z Białorusią i Ukrainą przebiega na:", o: ["Bugu", "Warcie", "Wiśle", "Odrze"], a: 0 },
            { q: "Ministrowi Spraw Wewnętrznych i Administracji podlegają:", o: ["Komendant Główny Policji", "Komendant Główny Straży Granicznej", "Komendant Służby Ochrony Państwa", "wszystkie ww. odpowiedzi są prawidłowe"], a: 3 },
            { q: "Cudzoziemiec w świetle prawa polskiego, to:", o: ["osoba, która nie mieszka w Polsce", "osoba, która przekroczyła granicę danego państwa", "osoba, która nie posiada obywatelstwa polskiego", "osoba, która migruje"], a: 2 },
            { q: "Ile oddziałów znajduje się w strukturze Straży Granicznej?", o: ["7", "9", "11", "12"], a: 1 },
            { q: "W jakich sytuacjach funkcjonariusz Straży Granicznej może użyć środków przymusu bezpośredniego?", o: ["tylko na granicy zewnętrznej", "w każdym przypadku nieposłuszeństwa", "w sytuacji zagrożenia zdrowia, życia lub naruszenia porządku prawnego", "tylko za zgodą sądu"], a: 2 },
            { q: "Co obejmuje kontrola graniczna?", o: ["tylko sprawdzenie paszportu", "ocenę dokumentów, osób i pojazdów przekraczających granicę", "sprawdzanie miejsc zamieszkania cudzoziemców", "weryfikację poziomu języka polskiego"], a: 1 },
            { q: "W jaki sposób Straż Graniczna przeciwdziała nielegalnej migracji?", o: ["poprzez działania tylko w urzędach", "poprzez wsparcie służb celnych", "poprzez patrole, monitoring granic i kontrole legalności pobytu", "poprzez działania wyłącznie prewencyjne"], a: 2 }
        ];

        let selectedQuestions = [];
        let currentIndex = 0;
        let score = 0;

        // Elementy DOM
        const startScreen = document.getElementById('start-screen');
        const questionScreen = document.getElementById('question-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');

        const questionTitle = document.getElementById('question-title');
        const optionsContainer = document.getElementById('options-container');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const scoreCounter = document.getElementById('score-counter');

        const finalScore = document.getElementById('final-score');
        const finalMessage = document.getElementById('final-message');
        const resultIcon = document.getElementById('result-icon');

        // Bezpieczny start - przypisanie event listenerów po załadowaniu drzewa DOM
        document.addEventListener('DOMContentLoaded', () => {
            startBtn.addEventListener('click', startQuiz);
            nextBtn.addEventListener('click', handleNextQuestion);
            restartBtn.addEventListener('click', startQuiz);
        });

        function startQuiz() {
            // Losowanie 10 unikalnych pytań z bazy
            const shuffled = [...DATABASE].sort(() => 0.5 - Math.random());
            selectedQuestions = shuffled.slice(0, 10);
            
            currentIndex = 0;
            score = 0;

            startScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            questionScreen.classList.remove('hidden');

            renderQuestion();
        }

        function renderQuestion() {
            const item = selectedQuestions[currentIndex];
            
            // Aktualizacja wskaźników
            progressText.innerText = `Pytanie ${currentIndex + 1} z ${selectedQuestions.length}`;
            progressBar.style.width = `${((currentIndex + 1) / selectedQuestions.length) * 100}%`;
            scoreCounter.innerText = `Wynik: ${score}`;

            questionTitle.innerText = `${currentIndex + 1}. ${item.q}`;
            optionsContainer.innerHTML = '';
            nextBtn.classList.add('hidden');

            const prefixes = ['a', 'b', 'c', 'd'];

            item.o.forEach((optText, idx) => {
                const button = document.createElement('button');
                button.className = "w-full text-left p-4 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 transition duration-150 flex items-start space-x-3 font-medium text-slate-700 option-btn";
                
                button.innerHTML = `
                    <span class="w-6 h-6 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs font-bold shrink-0 mt-0.5">${prefixes[idx]}</span>
                    <span>${optText}</span>
                `;

                button.addEventListener('click', () => handleOptionClick(idx, item.a, button));
                optionsContainer.appendChild(button);
            });
        }

        function handleOptionClick(selectedIdx, correctIdx, clickedBtn) {
            const allBtns = optionsContainer.querySelectorAll('.option-btn');
            
            // Zablokuj powtórne klikanie
            allBtns.forEach(btn => btn.disabled = true);

            if (selectedIdx === correctIdx) {
                score++;
                clickedBtn.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-700');
                clickedBtn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'font-semibold');
            } else {
                clickedBtn.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-700');
                clickedBtn.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-900');
                
                // Pokaż prawidłową odpowiedź
                const correctBtn = allBtns[correctIdx];
                correctBtn.classList.remove('bg-slate-50', 'border-slate-200', 'text-slate-700');
                correctBtn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-900', 'font-semibold');
            }

            scoreCounter.innerText = `Wynik: ${score}`;
            nextBtn.classList.remove('hidden');
        }

        function handleNextQuestion() {
            currentIndex++;
            if (currentIndex < selectedQuestions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            questionScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            finalScore.innerText = `${score} / ${selectedQuestions.length}`;

            if (score >= 9) {
                resultIcon.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 bg-emerald-100 text-emerald-600";
                resultIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>`;
                finalMessage.innerText = "Znakomity wynik! Jesteś w pełni przygotowany.";
            } else if (score >= 6) {
                resultIcon.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 bg-amber-100 text-amber-600";
                resultIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`;
                finalMessage.innerText = "Dobry wynik, ale warto jeszcze powtórzyć niektóre zagadnienia.";
            } else {
                resultIcon.className = "w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 bg-rose-100 text-rose-600";
                resultIcon.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>`;
                finalMessage.innerText = "Musisz poświęcić jeszcze trochę czasu na naukę. Spróbuj ponowne!";
            }
        }
    </script>
